/**/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/prius_base_control:
  ros__parameters:
    type: 'ackermann_steering_controller/AckermannSteeringController'
    use_sim_time: true
    wheelbase: 2.8
    # Between the wheel centers in the URDF: rear axle +-0.786, front wheels 0.05 inside
    traction_track_width: 1.572
    steering_track_width: 1.472
    traction_wheels_radius: 0.3
    steering_wheels_radius: 0.3
    reference_timeout: 2.0 # In s. Timeout to stop if no cmd_vel is received
    traction_joints_names: ['rear_right_wheel_joint', 'rear_left_wheel_joint']
    steering_joints_names: ['front_axle_right_joint', 'front_axle_left_joint']
    open_loop: false
    velocity_rolling_window_size: 10
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    # vy is not 0: no measurement is exact, and a zero variance destabilizes Kalman filters
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    position_feedback: false
