# Spawns the Prius in a running Gazebo, with its ros2_control controllers and the ROS-Gazebo
# bridge (clock, tf, imu, lidars and GPS).

launch:
- arg: {name: x, default: '287.0'}
- arg: {name: y, default: '-142.0'}
- arg: {name: z, default: '3.0'}
- arg: {name: yaw, default: '2.5'}
- arg: {name: use_sim_time, default: 'true'}

- node:
    pkg: robot_state_publisher
    exec: robot_state_publisher
    output: screen
    param:
    - name: robot_description
      type: str
      value: $(command 'xacro $(find-pkg-share easynav_playground_ackermann_description)/urdf/prius.urdf.xacro')
    - {name: publish_frequency, value: 100.0}
    - {name: use_sim_time, value: $(var use_sim_time)}

# The model name matters: the bridge reads /model/prius/odometry
- node:
    pkg: ros_gz_sim
    exec: create
    output: screen
    args: -name prius -topic robot_description -x $(var x) -y $(var y) -z $(var z) -Y $(var yaw)

- node:
    pkg: ros_gz_bridge
    exec: parameter_bridge
    name: bridge_ros_gz
    output: screen
    param:
    - {name: config_file, value: $(find-pkg-share easynav_playground_ackermann_worlds)/config/bridge/prius_bridge.yaml}
    - {name: use_sim_time, value: $(var use_sim_time)}

# The spawners wait for gz_ros2_control's controller_manager
- node:
    pkg: controller_manager
    exec: spawner
    output: screen
    args: >-
      --param-file $(find-pkg-share easynav_playground_ackermann_description)/config/prius_controllers.yaml
      joint_state_broadcaster
# The Ackermann controller publishes odom -> base_footprint on ~/tf_odometry, not on /tf
- node:
    pkg: controller_manager
    exec: spawner
    output: screen
    args: >-
      --param-file $(find-pkg-share easynav_playground_ackermann_description)/config/prius_controllers.yaml
      --controller-ros-args "-r ~/tf_odometry:=/tf"
      prius_base_control

# EasyNav publishes Twist on /cmd_vel; the Ackermann controller takes TwistStamped (v, w) and
# turns it into a steering angle
- node:
    pkg: twist_stamper
    exec: twist_stamper
    output: screen
    param:
    - {name: use_sim_time, value: $(var use_sim_time)}
    remap:
    - {from: cmd_vel_in, to: /cmd_vel}
    - {from: cmd_vel_out, to: /prius_base_control/reference}
