# Gazebo with the small house world and TIAGo.

launch:
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_tiago_worlds)/worlds/small_house.world
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}

- include:
    file: $(find-pkg-share easynav_playground_tiago_worlds)/launch/world.launch.yaml
    arg:
    - {name: world, value: $(var world)}
    - {name: gui, value: $(var gui)}

- include:
    file: $(find-pkg-share easynav_playground_tiago_worlds)/launch/tiago.launch.yaml
