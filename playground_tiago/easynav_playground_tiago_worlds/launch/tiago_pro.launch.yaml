# Spawns TIAGo Pro in a running Gazebo with its ros2_control controllers and the sensor bridge.
# As TIAGo, the base takes TwistStamped on /mobile_base_controller/cmd_vel (holonomic) and
# publishes /mobile_base_controller/odom; the arms, torso, head and grippers take trajectories
# (<controller>/follow_joint_trajectory or <controller>/joint_trajectory).

launch:
- arg: {name: x, default: '0.0'}
- arg: {name: y, default: '0.0'}
- arg: {name: z, default: '0.0'}
- arg: {name: Y, default: '0.0'}
- arg: {name: use_sim_time, default: 'true'}

- node:
    pkg: robot_state_publisher
    exec: robot_state_publisher
    output: screen
    param:
    - name: robot_description
      type: str
      value: $(command 'xacro $(find-pkg-share easynav_playground_tiago_description)/urdf/tiago_pro.urdf.xacro')
    - {name: use_sim_time, value: $(var use_sim_time)}

- node:
    pkg: ros_gz_sim
    exec: create
    output: screen
    args: -name tiago_pro -topic robot_description -x $(var x) -y $(var y) -z $(var z) -Y $(var Y)

- node:
    pkg: ros_gz_bridge
    exec: parameter_bridge
    name: bridge_ros_gz
    output: screen
    param:
    - {name: config_file, value: $(find-pkg-share easynav_playground_tiago_worlds)/config/bridge/tiago_pro_bridge.yaml}
    - {name: use_sim_time, value: $(var use_sim_time)}

# The spawners wait for gz_ros2_control's controller_manager
- node:
    pkg: controller_manager
    exec: spawner
    output: screen
    args: >-
      --param-file $(find-pkg-share easynav_playground_tiago_description)/config/tiago_pro_controllers.yaml
      joint_state_broadcaster torso_controller head_controller arm_left_controller
      arm_right_controller gripper_left_controller gripper_right_controller

# The mecanum controller's topics, renamed as TIAGo's diff drive ones
- node:
    pkg: controller_manager
    exec: spawner
    output: screen
    args: >-
      --param-file $(find-pkg-share easynav_playground_tiago_description)/config/tiago_pro_controllers.yaml
      --controller-ros-args "-r /mobile_base_controller/reference:=/mobile_base_controller/cmd_vel
      -r /mobile_base_controller/odometry:=/mobile_base_controller/odom
      -r /mobile_base_controller/tf_odometry:=/tf"
      mobile_base_controller
