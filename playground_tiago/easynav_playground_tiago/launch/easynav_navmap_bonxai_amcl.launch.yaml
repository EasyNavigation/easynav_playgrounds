# NavMap (20 cm, from the house map) and Bonxai (3D cloud of the house): NavMap AMCL corrects
# against Bonxai with the base laser and the head camera; A* on the NavMap and Regulated Pure
# Pursuit.

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_playground_tiago)/params/navmap.bonxai.amcl.params.yaml
    description: EasyNav ROS 2 parameters file
- arg:
    name: rviz_config
    default: $(find-pkg-share easynav_playground_tiago)/rviz/easynav_navmap_bonxai.rviz
    description: RViz2 configuration file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: rviz, default: 'true', description: Start RViz2}

- include:
    file: $(find-pkg-share easynav_playground_tiago)/launch/easynav_gazebo_sim.launch.yaml
    arg:
    - {name: params_file, value: $(var params_file)}
    - {name: rviz_config, value: $(var rviz_config)}
    - {name: gui, value: $(var gui)}
    - {name: rviz, value: $(var rviz)}
