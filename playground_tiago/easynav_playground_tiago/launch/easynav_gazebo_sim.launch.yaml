# Simulation + EasyNav + RViz2. The easynav_<config>.launch.yaml files include
# this one with their own params_file and rviz_config.

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_playground_tiago)/params/costmap.rpp.params.yaml
    description: EasyNav ROS 2 parameters file
- arg:
    name: rviz_config
    default: $(find-pkg-share easynav_playground_tiago)/rviz/easynav_costmap.rviz
    description: RViz2 configuration file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: rviz, default: 'true', description: Start RViz2}

- include:
    file: $(find-pkg-share easynav_playground_tiago_worlds)/launch/gazebo_sim.launch.yaml
    arg:
    - {name: gui, value: $(var gui)}

# Give Gazebo time to come up before starting EasyNav
- timer:
    period: 5.0
    children:
    - node:
        pkg: easynav_system
        exec: system_main
        output: screen
        on_exit: shutdown
        param:
        - from: $(var params_file)
        # TIAGo's base controller: TwistStamped commands (use_cmd_vel_stamped in the params
        # file) and its odometry
        remap:
        - {from: cmd_vel_stamped, to: /mobile_base_controller/cmd_vel}
        - {from: odom, to: /mobile_base_controller/odom}

- node:
    if: $(var rviz)
    pkg: rviz2
    exec: rviz2
    output: screen
    args: -d $(var rviz_config)
    param:
    - {name: use_sim_time, value: true}
