# Gazebo with the Nathan Benderson Park town and the UFO, hovering over the central road.

launch:
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_aerial_worlds)/worlds/nathan_benderson_town.sdf
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: x, default: '-65.0'}
- arg: {name: y, default: '880.0'}
- arg: {name: z, default: '6.0'}
- arg: {name: yaw, default: '1.5708'}

- include:
    file: $(find-pkg-share easynav_playground_aerial_worlds)/launch/world.launch.yaml
    arg:
    - {name: world, value: $(var world)}
    - {name: gui, value: $(var gui)}

- include:
    file: $(find-pkg-share easynav_playground_aerial_worlds)/launch/ufo.launch.yaml
    arg:
    - {name: x, value: $(var x)}
    - {name: y, value: $(var y)}
    - {name: z, value: $(var z)}
    - {name: yaw, value: $(var yaw)}
