# Gazebo server (+ optional client) with the Nathan Benderson Park town, no robots.

launch:
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_aerial_worlds)/worlds/nathan_benderson_town.sdf
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}

# Gazebo finds the town models here, and its system plugins in the library path, as
# ros_gz_sim's gz_sim.launch.py does
- set_env:
    name: GZ_SIM_RESOURCE_PATH
    value: $(find-pkg-share easynav_playground_aerial_worlds)/models:$(env GZ_SIM_RESOURCE_PATH '')
- set_env:
    name: GZ_SIM_SYSTEM_PLUGIN_PATH
    value: $(env GZ_SIM_SYSTEM_PLUGIN_PATH ''):$(env LD_LIBRARY_PATH '')

# The server is started without a shell (gz_sim.launch.py uses one), so the launch's
# signals reach it directly.
- executable:
    name: gz_server
    cmd: gz sim -r -s $(var world)
    output: screen
# "gz sim -g" starts the GUI client through "sh -c" and does not pass signals on, so the
# window would outlive the launch. bash runs it in its own process group (set -m): on
# SIGINT it sends SIGTERM to the whole group once (Ctrl+C delivers a second SIGINT, which
# is ignored), waits until the client has closed (it takes a few seconds) and exits with
# 0; if the launch escalates to SIGTERM, the group is killed.
- executable:
    if: $(var gui)
    name: gz_gui
    cmd: bash -c 'set -m; gz sim -g & p=$!; trap "trap true INT; kill -TERM -- -$p; wait $p; while kill -0 -- -$p 2>/dev/null; do sleep 0.2; done; exit 0" INT; trap "kill -KILL -- -$p" TERM; wait $p'
    sigterm_timeout: 10.0
    output: screen
