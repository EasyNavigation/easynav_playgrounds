# Gazebo server (+ optional client) with a world file of the marine playground, no robots.
# marine_sim.launch.py makes the world (the sea floor, the water, the vehicle) and includes this.

launch:
- arg:
    name: world
    description: Gazebo world file (marine_sim.launch.py writes it to ~/.ros/easynav_playground_marine/)
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}

# the models of the playground (the WAM-V, the Tethys), and the system plugins of Gazebo
- set_env:
    name: GZ_SIM_RESOURCE_PATH
    value: $(find-pkg-share easynav_playground_marine_description)/models:$(env GZ_SIM_RESOURCE_PATH '')
- set_env:
    name: GZ_SIM_SYSTEM_PLUGIN_PATH
    value: $(env GZ_SIM_SYSTEM_PLUGIN_PATH ''):$(env LD_LIBRARY_PATH '')

# Gazebo is started without a shell, so the launch's signals reach it: on shutdown, no server
# or GUI client is left behind
- executable:
    name: gz_server
    cmd: gz sim -r -s $(var world)
    output: screen
- executable:
    if: $(var gui)
    name: gz_gui
    cmd: gz sim -g
    output: screen
