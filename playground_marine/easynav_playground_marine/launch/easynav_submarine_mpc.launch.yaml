# EasyNav drives the Tethys in the synthetic sea: dead reckoning (IMU, DVL, depth gauge; the GNSS
# at the surface), the sea floor's Bonxai map, A* in 3D and the MPC. Goals under the water: the 3D
# Goal Pose tool of RViz (shortcut h).

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_playground_marine)/params/submarine_mpc.params.yaml
    description: EasyNav ROS 2 parameters file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: rviz, default: 'true', description: Start RViz2}
- arg:
    name: waves
    default: 'false'
    description: 'true: the vehicle moves as in a sea (see the marine_sim launch for the rest)'

# The simulation, without its own RViz and without the transforms of the true pose: the
# localizer publishes map -> odom -> base_footprint. In a group, so its rviz:=false does
# not overwrite this launch's rviz
- group:
  - include:
      file: $(find-pkg-share easynav_playground_marine_worlds)/launch/marine_sim.launch.py
      arg:
      - {name: robot, value: submarine}
      - {name: gui, value: $(var gui)}
      - {name: rviz, value: 'false'}
      - {name: odom_tf, value: 'false'}
      - {name: waves, value: $(var waves)}

- timer:
    period: 5.0
    children:
    - node:
        pkg: easynav_system
        exec: system_main
        output: screen
        on_exit: shutdown
        param:
        - from: $(var params_file)

- node:
    if: $(var rviz)
    pkg: rviz2
    exec: rviz2
    output: screen
    args: -d $(find-pkg-share easynav_playground_marine)/rviz/submarine_easynav.rviz
    param:
    - {name: use_sim_time, value: true}
