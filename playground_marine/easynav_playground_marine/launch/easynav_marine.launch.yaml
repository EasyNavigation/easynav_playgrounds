# Marine playground: Gazebo with water and a boat or a submarine in it. Only the simulation: no
# navigation system of the family works on water yet (see the README).
#
#   ros2 launch easynav_playground_marine easynav_marine.launch.yaml robot:=boat
#   ros2 launch easynav_playground_marine easynav_marine.launch.yaml robot:=submarine
#   ros2 launch easynav_playground_marine easynav_marine.launch.yaml robot:=boat waves:=true wave_height:=1.0
#
# The sea is synthetic (offline, always the same). Drive the vehicle with a Twist on /cmd_vel (see
# the message at the start of the launch).

launch:
- arg:
    name: robot
    default: boat
    description: 'boat (the WAM-V, on the water) or submarine (the Tethys LRAUV, under it)'
- arg:
    name: radius
    default: ''
    description: Half-side of the square sea, in metres ('' = 500, at least 100)
- arg:
    name: altitude
    default: ''
    description: robot:=submarine, depth under the surface in metres ('' = half way to the floor, at most 3); robot:=boat, ignored
- arg:
    name: gui
    default: 'true'
    description: Gazebo GUI
- arg:
    name: waves
    default: 'false'
    description: 'true: the vehicle moves as in a sea, and the water is drawn with the waves'
- arg:
    name: wave_visual
    default: 'true'
    description: waves:=true, draw the waves on the water (a shader); false, the water that is drawn stays flat
- arg:
    name: wave_height
    default: '0.4'
    description: waves:=true, height of the main wave in metres, crest to trough (0 to 2)
- arg:
    name: wave_period
    default: '4.0'
    description: waves:=true, period of the main wave in seconds (2 to 15)
- arg:
    name: wave_direction
    default: '180'
    description: waves:=true, where the main wave goes in degrees (0 east, 90 north, 180 to the beach)

- include:
    file: $(find-pkg-share easynav_playground_marine_worlds)/launch/marine_sim.launch.py
    arg:
    - {name: robot, value: $(var robot)}
    - {name: radius, value: $(var radius)}
    - {name: altitude, value: $(var altitude)}
    - {name: gui, value: $(var gui)}
    - {name: waves, value: $(var waves)}
    - {name: wave_visual, value: $(var wave_visual)}
    - {name: wave_height, value: $(var wave_height)}
    - {name: wave_period, value: $(var wave_period)}
    - {name: wave_direction, value: $(var wave_direction)}
