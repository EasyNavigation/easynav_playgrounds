# The omnidirectional robot with the MPC, moving facing along the path (it corrects sideways).
# Arguments: world, robot, gui and rviz, as in easynav_navigation_gazebo_sim.launch.yaml.
launch:
- arg: {name: world, default: maze2}
- arg: {name: robot, default: 3w_v2}
- arg: {name: gui, default: 'true'}
- arg: {name: rviz, default: 'true'}
- include:
    file: $(find-pkg-share easynav_playground_omni)/launch/easynav_navigation_gazebo_sim.launch.yaml
    arg:
    - {name: world, value: $(var world)}
    - {name: robot, value: $(var robot)}
    - {name: gui, value: $(var gui)}
    - {name: rviz, value: $(var rviz)}
    - {name: heading_mode, value: path}
    - {name: params_file, value: $(find-pkg-share easynav_playground_omni)/params/easynav_costmap_mpc.params.yaml}
