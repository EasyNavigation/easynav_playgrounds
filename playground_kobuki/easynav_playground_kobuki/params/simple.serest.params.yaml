controller_node:
  ros__parameters:
    use_sim_time: true
    # Robot velocity/acceleration limits: the controller plugins use them, and the velocity
    # smoother enforces them on every command published (see ControllerNode).
    robot_limits:
      max_linear_vel: 0.6
      min_linear_vel: -0.6
      max_angular_vel: 1.5
      max_linear_acc: 0.8
      max_linear_decel: 1.0
      max_angular_acc: 2.0
      max_angular_decel: 2.0
    controller_types: [serest]
    serest:
      rt_freq: 30.0 
      plugin: easynav_serest_controller/SerestController
      allow_reverse: true
      v_progress_min: 0.08        
      k_s_share_max: 0.5         
      k_theta: 2.5                
      k_y: 1.5
      goal_pos_tol: 0.1      
      goal_yaw_tol_deg: 6.0       
      slow_radius: 0.80
      slow_min_speed: 0.02
      final_align_k: 2.5
      final_align_wmax: 0.8
      corner_guard_enable: true
      corner_gain_ey: 1.8
      corner_gain_eth: 0.7
      corner_gain_kappa: 0.4
      corner_min_alpha: 0.35
      corner_boost_omega: 1.0
      a_lat_soft: 0.9
      apex_ey_des: 0.05

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [simple]
    simple:
      rt_freq: 50.0
      freq: 5.0
      reseed_freq: 1.0
      plugin: easynav_simple_localizer/AMCLLocalizer
      num_particles: 100
      noise_translation: 0.05
      noise_rotation: 0.1
      noise_translation_to_rotation: 0.1
      initial_pose:
        x: 0.0
        y: 0.0
        yaw: 0.0
        std_dev_xy: 0.1
        std_dev_yaw: 0.01

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [simple]
    simple:
      freq: 10.0 
      plugin: easynav_simple_maps_manager/SimpleMapsManager
      package: easynav_playground_kobuki
      map_path_file: maps/home.map

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [simple]
    simple:
      freq: 0.5
      plugin: easynav_simple_planner/SimplePlanner

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    sensors: [laser1]
    perception_default_frame: odom
    laser1:
      topic: scan_raw
      type: sensor_msgs/msg/LaserScan
      
system_node:
  ros__parameters:
    # The robot's shape, shared by every component (collision checking, inflation, recovery...).
    robot_geometry:
      radius: 0.25
      height: 0.5
    use_sim_time: true
    position_tolerance: 0.3
    angle_tolerance: 0.15

recovery_node:
  ros__parameters:
    use_sim_time: true
    # Recovery system: a RecoveryManagerBase plugin, with its own parameters below it.
    # SimpleRecoveryManager: brakes before an obstacle ahead, rotates to relocalize, backs up when
    # stuck, and aborts the mission or terminates EasyNav when that is not enough.
    recovery_manager:
      plugin: easynav_simple_recovery/SimpleRecoveryManager
      stop_distance: 0.3          # brake if an obstacle is this close ahead (beyond the robot radius)
      min_obstacle_z: 0.05
      sensors_timeout: 5.0        # s without sensor data: terminate EasyNav
      max_position_variance: 1.0  # m^2 in x or y: localization lost
      relocalize_timeout: 20.0
      rotate_speed: 0.3
      stuck_time: 10.0
      stuck_distance: 0.05
      backup_speed: 0.1
      backup_time: 2.0
      max_backup_attempts: 3
      slow_down_max_linear_vel: 0.1  # still stuck after the attempts: slow down, then abort
