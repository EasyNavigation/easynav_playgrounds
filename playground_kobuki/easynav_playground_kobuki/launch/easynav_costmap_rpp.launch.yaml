# Costmap stack with the Regulated Pure Pursuit controller.

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_playground_kobuki)/params/costmap.rpp.params.yaml
    description: EasyNav ROS 2 parameters file
- arg:
    name: rviz_config
    default: $(find-pkg-share easynav_playground_kobuki)/rviz/easynav_costmap.rviz
    description: RViz2 configuration file

- include:
    file: $(find-pkg-share easynav_playground_kobuki)/launch/easynav_gazebo_sim.launch.yaml
    arg:
    - {name: params_file, value: $(var params_file)}
    - {name: rviz_config, value: $(var rviz_config)}
