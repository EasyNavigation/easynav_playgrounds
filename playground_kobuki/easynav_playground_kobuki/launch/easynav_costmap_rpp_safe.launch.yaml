# RPP in safety mode with the process memory locked (needs real-time limits,
# see the params file).

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_playground_kobuki)/params/costmap.rpp.safe.params.yaml
    description: EasyNav ROS 2 parameters file
- arg:
    name: rviz_config
    default: $(find-pkg-share easynav_playground_kobuki)/rviz/easynav_costmap.rviz
    description: RViz2 configuration file
- arg:
    name: safety_channel
    default: 'true'
    description: >-
      Publish an "all clear" safety status; false to publish your own
      (e.g. a protective stop) on /easynav_safety_status

- include:
    file: $(find-pkg-share easynav_playground_kobuki)/launch/easynav_gazebo_sim.launch.yaml
    arg:
    - {name: params_file, value: $(var params_file)}
    - {name: rviz_config, value: $(var rviz_config)}

# Stands in for the safety channel (safety PLC, scanner): "all clear" at 10 Hz
- executable:
    if: $(var safety_channel)
    cmd: >-
      ros2 topic pub -r 10 /easynav_safety_status
      easynav_interfaces/msg/SafetyStatus '{active_field: simulation}'
    output: log
