# Gazebo with the small house world and one Kobuki.

launch:
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_kobuki_worlds)/worlds/small_house.world
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: lidar_range, default: '3.0', description: Maximum lidar range (m)}
- arg: {name: camera, default: 'false', description: Enable the RGBD camera}

- include:
    file: $(find-pkg-share easynav_playground_kobuki_worlds)/launch/world.launch.yaml
    arg:
    - {name: world, value: $(var world)}
    - {name: gui, value: $(var gui)}

- include:
    file: $(find-pkg-share easynav_playground_kobuki_worlds)/launch/kobuki.launch.yaml
    arg:
    - {name: lidar_range, value: $(var lidar_range)}
    - {name: camera, value: $(var camera)}
