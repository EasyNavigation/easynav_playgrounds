# Gazebo server (+ optional client) and the /clock bridge, no robots.

launch:
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_kobuki_worlds)/worlds/small_house.world
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}

# Gazebo finds the house models here
- set_env:
    name: GZ_SIM_RESOURCE_PATH
    value: $(find-pkg-share easynav_playground_kobuki_worlds)/models:$(env GZ_SIM_RESOURCE_PATH '')

- set_env:
    name: GZ_SIM_SYSTEM_PLUGIN_PATH
    value: $(env GZ_SIM_SYSTEM_PLUGIN_PATH ''):$(env LD_LIBRARY_PATH '')

# Gazebo is started without a shell (gz_sim.launch.py uses one) and the GUI client runs
# directly ("gz sim -g" runs it as a child that outlives a SIGTERM), so the launch's
# signals reach both: on shutdown, no server or GUI window is left behind.
- executable:
    name: gz_server
    cmd: gz sim -r -s $(var world)
    output: screen
- executable:
    if: $(var gui)
    name: gz_gui
    cmd: $(find-pkg-prefix gz_sim_vendor)/opt/gz_sim_vendor/libexec/gz/sim/gz-sim-gui-client
    output: screen

- node:
    pkg: ros_gz_bridge
    exec: parameter_bridge
    name: bridge_ros_gz_clock
    output: screen
    param:
    - {name: config_file, value: $(find-pkg-share easynav_playground_kobuki_worlds)/config/bridge/clock_bridge.yaml}
    - {name: use_sim_time, value: true}
