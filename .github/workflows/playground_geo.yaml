# The tests of the geo playground (easynav_playground_geo and easynav_playground_geo_worlds), twice:
# without laspy and laszip (the default, OpenStreetMap worlds: ign:=true must stop saying what is
# missing) and with them (ign:=true: the IGN data of Spain, reading a PNOA-LiDAR .laz). The tests
# need no network and start no simulation.
name: playground_geo

on:
  pull_request:
    branches:
      - rolling
    paths:
      - 'playground_geo/**'
      - 'playground_summit/easynav_playground_summit_description/**'
      - 'playground_summit/easynav_playground_summit_worlds/**'
      - '.github/playground_geo.repos'
      - '.github/workflows/playground_geo.yaml'
  push:
    branches:
      - rolling
    paths:
      - 'playground_geo/**'
      - 'playground_summit/easynav_playground_summit_description/**'
      - 'playground_summit/easynav_playground_summit_worlds/**'
      - '.github/playground_geo.repos'
      - '.github/workflows/playground_geo.yaml'
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  test:
    name: test (ign ${{ matrix.ign }})
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-resolute-ros-rolling-ros-base:master
    strategy:
      fail-fast: false
      matrix:
        ign: [false, true]
    env:
      # what the tests expect of laspy and laszip
      GEO_IGN_DEPS: ${{ matrix.ign && 'installed' || 'missing' }}
    defaults:
      run:
        shell: bash
        working-directory: ros_ws
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
        with:
          path: ros_ws/src/easynav_playgrounds
      # The image can lag behind the published packages, and mixing them breaks the ABI: upgrade it
      # first.
      - name: Upgrade the image's packages
        run: apt-get update && apt-get -y dist-upgrade
      - name: NavMap
        run: vcs import src < src/easynav_playgrounds/.github/playground_geo.repos
      - name: Dependencies (rosdep)
        run: |
          rosdep update --rosdistro rolling
          rosdep install -y --rosdistro rolling --ignore-src --from-paths \
            src/easynav_playgrounds/playground_geo \
            src/easynav_playgrounds/playground_summit/easynav_playground_summit_description \
            src/easynav_playgrounds/playground_summit/easynav_playground_summit_worlds \
            src/NavMap/navmap_core src/NavMap/navmap_ros src/NavMap/navmap_ros_interfaces \
            src/NavMap/navmap_tools
      - name: The optional dependencies of ign:=true
        if: matrix.ign
        run: apt-get install -y python3-laspy python3-laszip
      - name: Build
        run: |
          source /opt/ros/rolling/setup.bash
          colcon build --packages-up-to easynav_playground_geo --event-handlers console_cohesion+
      - name: Test
        run: |
          source install/setup.bash
          colcon test --packages-select easynav_playground_geo_worlds easynav_playground_geo \
            --return-code-on-test-failure --event-handlers console_cohesion+
      - name: Test results
        if: always()
        run: colcon test-result --verbose
