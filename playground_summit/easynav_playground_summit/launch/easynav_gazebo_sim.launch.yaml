# Simulation + EasyNav + RViz2. The easynav_<config>.launch.yaml files include
# this one with their own params_file and rviz_config.

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_playground_summit)/params/bonxai.amcl.params.yaml
    description: EasyNav ROS 2 parameters file
- arg:
    name: rviz_config
    default: $(find-pkg-share easynav_playground_summit)/rviz/easynav_bonxai_amcl.rviz
    description: RViz2 configuration file
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_summit_worlds)/worlds/urjc_excavation.world
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: rviz, default: 'true', description: Start RViz2}

- include:
    file: $(find-pkg-share easynav_playground_summit_worlds)/launch/gazebo_sim.launch.yaml
    arg:
    - {name: world, value: $(var world)}
    - {name: gui, value: $(var gui)}

# Give Gazebo and the controllers time to come up before starting EasyNav
- timer:
    period: 5.0
    children:
    - node:
        pkg: easynav_system
        exec: system_main
        output: screen
        on_exit: shutdown
        param:
        - from: $(var params_file)

- node:
    if: $(var rviz)
    pkg: rviz2
    exec: rviz2
    output: screen
    args: -d $(var rviz_config)
    param:
    - {name: use_sim_time, value: true}
