# Loads and shows the NavMap (maps/excavation_urjc_2.navmap); dummy controller, localizer and planner.

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_playground_summit)/params/navmap.dummy.params.yaml
    description: EasyNav ROS 2 parameters file
- arg:
    name: rviz_config
    default: $(find-pkg-share easynav_playground_summit)/rviz/easynav_navmap.rviz
    description: RViz2 configuration file

- include:
    file: $(find-pkg-share easynav_playground_summit)/launch/easynav_gazebo_sim.launch.yaml
    arg:
    - {name: params_file, value: $(var params_file)}
    - {name: rviz_config, value: $(var rviz_config)}

# The dummy localizer publishes no map -> odom: make map coincide with odom, so RViz2
# (fixed frame map) can place the robot and its sensors on the NavMap
- node:
    pkg: tf2_ros
    exec: static_transform_publisher
    args: --frame-id map --child-frame-id odom
    param:
    - {name: use_sim_time, value: true}
