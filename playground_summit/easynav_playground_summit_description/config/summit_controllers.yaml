/**/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/robotnik_base_control:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.614
    wheel_radius: 0.1175

    # Skid steering with the wheel friction in rubber_wheel.urdf.xacro: commanded and simulated
    # turns match (measured against Gazebo ground truth)
    wheel_separation_multiplier: 0.71
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: -1.0

    publish_rate: 50.0
    base_frame_id: base_footprint
    pose_covariance_diagonal : [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    # vy is not 0: no measurement is exact, and a zero variance destabilizes Kalman filters
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    # publish_limited_velocity: true
    use_stamped_vel: true
    # velocity_rolling_window_size: 1

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 3.0
    linear.x.min_velocity: -3.0
    linear.x.max_acceleration: .NAN
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0
    angular.z.max_acceleration: .NAN
    angular.z.min_acceleration: .NAN
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN
