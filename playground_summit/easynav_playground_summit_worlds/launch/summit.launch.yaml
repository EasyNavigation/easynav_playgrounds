# Spawns the Summit XL in a running Gazebo, with its ros2_control controllers and
# the ROS-Gazebo bridge (clock, tf, imu, lidar, depth camera and GPS).

launch:
- arg: {name: x, default: '0.0'}
- arg: {name: y, default: '0.0'}
- arg: {name: z, default: '0.5'}
- arg: {name: use_sim_time, default: 'true'}

- node:
    pkg: robot_state_publisher
    exec: robot_state_publisher
    output: screen
    param:
    - name: robot_description
      type: str
      value: $(command 'xacro $(find-pkg-share easynav_playground_summit_description)/urdf/summit_xl.urdf.xacro')
    - {name: publish_frequency, value: 100.0}
    - {name: use_sim_time, value: $(var use_sim_time)}

# The model name matters: the bridge reads /model/summit_xl/odometry
- node:
    pkg: ros_gz_sim
    exec: create
    output: screen
    args: -name summit_xl -topic robot_description -x $(var x) -y $(var y) -z $(var z)

- node:
    pkg: ros_gz_bridge
    exec: parameter_bridge
    name: bridge_ros_gz
    output: screen
    param:
    - {name: config_file, value: $(find-pkg-share easynav_playground_summit_worlds)/config/bridge/summit_bridge.yaml}
    - {name: use_sim_time, value: $(var use_sim_time)}

# The spawner waits for gz_ros2_control's controller_manager
- node:
    pkg: controller_manager
    exec: spawner
    output: screen
    args: >-
      --param-file $(find-pkg-share easynav_playground_summit_description)/config/summit_controllers.yaml
      joint_state_broadcaster robotnik_base_control

# EasyNav publishes Twist on /cmd_vel; the diff drive controller takes TwistStamped
- node:
    pkg: twist_stamper
    exec: twist_stamper
    output: screen
    param:
    - {name: use_sim_time, value: $(var use_sim_time)}
    remap:
    - {from: cmd_vel_in, to: /cmd_vel}
    - {from: cmd_vel_out, to: /robotnik_base_control/cmd_vel}
