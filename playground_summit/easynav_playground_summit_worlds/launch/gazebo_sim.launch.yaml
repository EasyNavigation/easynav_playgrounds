# Gazebo with the URJC excavation world and the Summit XL.

launch:
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_summit_worlds)/worlds/urjc_excavation.world
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: x, default: '0.0'}
- arg: {name: y, default: '0.0'}

- include:
    file: $(find-pkg-share easynav_playground_summit_worlds)/launch/world.launch.yaml
    arg:
    - {name: world, value: $(var world)}
    - {name: gui, value: $(var gui)}

- include:
    file: $(find-pkg-share easynav_playground_summit_worlds)/launch/summit.launch.yaml
    arg:
    - {name: x, value: $(var x)}
    - {name: y, value: $(var y)}
